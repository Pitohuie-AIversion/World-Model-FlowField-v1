name: CI Testing & Physical Invariance Validation

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'docs/**'
      - 'outputs/**'
      - '*.md'
      - 'LICENSE'
  pull_request:
    branches: [ main ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Check out repository
      uses: actions/checkout@v4

    - name: Install uv
      uses: astral-sh/setup-uv@v4
      with:
        enable-cache: true

    - name: Run PyTest Test Suite
      run: |
        uv run --extra test --index-url https://download.pytorch.org/whl/cpu pytest tests -v

