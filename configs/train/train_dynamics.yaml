# Training configuration for Dynamics Models (Stage C & D)
experiment_name: "dynamics_v1"

training:
  batch_size: 4
  gradient_accumulation_steps: 2  # Equivalent batch size = 8
  epochs: 50
  max_steps: 100000
  mixed_precision: "bf16"
  max_time_hours: 8.0

optimizer:
  type: "AdamW"
  lr: 1.0e-4
  weight_decay: 1.0e-2
  betas: [0.9, 0.99]
  eps: 1.0e-8

scheduler:
  type: "cosine"
  warmup_steps: 500
  min_lr: 1.0e-6

losses:
  field_loss_type: "mse"
  weights_field: [1.0, 1.0, 1.0, 1.0]  # [u, v, p, s]
  lambda_div: 0.01
  lambda_vort: 0.05
  rollout_weight_mode: "uniform"

checkpoint:
  save_every_steps: 2000
  keep_top_k: 3
